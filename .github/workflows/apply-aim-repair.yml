name: Apply and verify aiming repair
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'Maxkhrys/stickman' && github.event.pull_request.number == 5 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/aim-shot-alignment-v3' && github.base_ref == 'feat/drawn-renderer-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply checksum-verified source repair to this branch only
        run: |
          test "$(git rev-parse HEAD^)" = 1fcc9062c5d074a327fe1a4ff0617aca3b8ec3cb
          cat .github/aim-transfer/part1 .github/aim-transfer/part2 .github/aim-transfer/part3 | gzip -dc > /tmp/aim.patch
          echo 'cee2cd71362ce6219ce2b8bfebbe528d1522ddbca9d7cc7d4311b3b2319abf9b  /tmp/aim.patch' | sha256sum -c -
          git apply --check --exclude=.github/workflows/verify.yml /tmp/aim.patch
          git apply --exclude=.github/workflows/verify.yml /tmp/aim.patch
          git rm -r .github/aim-transfer
          git add ARCHITECTURE.md docs/AIM_SHOOTING_FIX.md package.json src tests
      - run: npm ci
      - name: Verify before publishing source commit
        run: npm test && npm run test:upgrade && npm run test:motion && npm run test:sketch && npm run test:aim && npm run build
      - name: Publish checked source on the repair branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: centre aim, align muzzle sockets and trace complete barrel paths'
          git push origin HEAD:refs/heads/fix/aim-shot-alignment-v3
          mkdir -p verification/aim
          git rev-parse HEAD > verification/aim/commit.txt
      - run: npx playwright install --with-deps chromium
      - name: Browser flow, aiming regressions and screenshots
        run: |
          npm run dev -- --host 127.0.0.1 --port 5178 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:5178/ >/dev/null && break; sleep 1; done
          xvfb-run -a node tests/browser.mjs
          node tests/aim.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stickfight-aim-verification
          path: verification/
